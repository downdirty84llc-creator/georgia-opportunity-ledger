name: Production readiness

# Deliberately its own workflow rather than a job inside CI.
#
# It was a job in ci.yml first, gated on `workflow_dispatch`. That was wrong in
# a way that only showed up when the button was pressed: `workflow_dispatch` is
# also how you re-run ordinary CI by hand, so every manual CI run dragged
# preflight in with it and went red on missing production secrets. A pipeline
# that cannot go green until launch day teaches people to ignore it.
#
# Split out, the two questions stay separate. CI asks "is the code correct?"
# and can be green today. This asks "is production ready?" and is supposed to
# be red until it is — including the items only a person can close, which is
# why it is run on purpose rather than on every push.
on:
  workflow_dispatch:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Launch checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Exits non-zero while anything is outstanding, so a green run here is
      # the launch gate. Anything it cannot reach is reported as "could not
      # check" and keeps the run red — never silently as ready.
      - run: npm run preflight
        env:
          NEXT_PUBLIC_ENVIRONMENT: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          FILE_SCANNER_PROVIDER: ${{ secrets.FILE_SCANNER_PROVIDER }}
          FILE_SCANNER_URL: ${{ secrets.FILE_SCANNER_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
