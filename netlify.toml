# Netlify build configuration.
#
# Hand-written. The scheduled functions in netlify/functions are generated from
# src/lib/jobs/registry.ts — run `npm run schedules:generate` after changing a
# job or its cadence, and `npm run schedules:check` fails the build if the
# committed files have drifted.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Supabase pg_cron is the single scheduler. Do not deploy the generated
  # proxy functions as well: they duplicate calls and bill their wait time.
  directory = "netlify/manual-functions"
  node_bundler = "esbuild"

# API jobs and upload finalization use the 60-second synchronous budget.
# File bytes travel directly to Supabase; only metadata crosses this host.
